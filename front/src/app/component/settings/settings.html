<div class="dashboard-layout">

    <app-sidebar></app-sidebar>

    <main class="main">

        <div class="settings-page">

            <!-- Header -->
            <div class="page-header">

                <div>
                    <h2>Settings</h2>
                    <p>Manage your account preferences</p>
                </div>

                <button class="save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Changes
                </button>

            </div>



            <!-- Profile -->

            <div class="card">

                <h3>Profile Information</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" value="Alex">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="alex@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" value="+91 9876543210">
                    </div>

                </div>

            </div>



            <!-- Password -->

            <div class="card">

                <h3>Change Password</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password">
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password">
                    </div>

                </div>

            </div>



            <!-- Preferences -->

            <div class="card">

                <h3>Preferences</h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Currency</label>

                        <select>

                            <option>INR (₹)</option>
                            <option>USD ($)</option>
                            <option>EUR (€)</option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label>Theme</label>

                        <select>

                            <option>Light</option>
                            <option>Dark</option>

                        </select>

                    </div>

                </div>

            </div>



            <!-- Notification -->

            <div class="card">

                <h3>Notifications</h3>

                <div class="switch-row">

                    <span>Email Notifications</span>

                    <input type="checkbox" checked>

                </div>

                <div class="switch-row">

                    <span>Push Notifications</span>

                    <input type="checkbox">

                </div>

            </div>

        </div>

    </main>

</div>
